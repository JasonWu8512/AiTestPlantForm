# 简化版 - 只启动 Redis，前后端本地运行
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aitest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
    driver: local
