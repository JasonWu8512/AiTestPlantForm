  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7-alpine
    container_name: aitest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitest-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media-data:/app/media
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-for-testing-change-in-production
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=*
      - DB_ENGINE=sqlite
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitest-celery-worker
    command: celery -A tasks.celery worker --loglevel=info
    volumes:
      - ./backend:/app
      - media-data:/app/media
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-for-testing-change-in-production
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=*
      - DB_ENGINE=sqlite
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitest-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # mysql-data:
  #   driver: local
  redis-data:
    driver: local
  media-data:
    driver: local
